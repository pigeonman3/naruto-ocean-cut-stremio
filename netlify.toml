[build]
  # No build command needed - this is a static site with JSON files
  publish = "."
  

[[headers]]
  # Apply CORS headers to all JSON files for Stremio to access them
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Cache-Control = "public, max-age=3600"

[[headers]]
  # Special cache control for manifest
  for = "/manifest.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[redirects]]
  # Stremio requests search/pagination as /catalog/series/narutooc_catalog/search=....json.
  # There is only one show, so always return the catalog.
  from = "/catalog/series/narutooc_catalog/*"
  to = "/catalog/series/narutooc_catalog.json"
  status = 200

# Note: no SPA catch-all. Unknown addon paths must 404 instead of returning
# index.html, which Stremio cannot parse as JSON.
